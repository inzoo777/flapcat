<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Cat Sky</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 360px;
      height: 640px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="360" height="640"></canvas>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // State Variables
  let gameState = "START"; // START, PLAYING, GAMEOVER
  let score = 0;
  let highScore = localStorage.getItem("flappyCatHighScore") || 0;
  let frameCount = 0;

  // Cat Object
  const cat = {
    x: 80,
    y: 280,
    width: 38,
    height: 38,
    gravity: 0.35,
    lift: -7.5,
    velocity: 0,
    reset() {
      this.y = 280;
      this.velocity = 0;
    },
    update() {
      this.velocity += this.gravity;
      this.y += this.velocity;

      // Floor / Ceiling constraints
      if (this.y + this.height >= canvas.height - 40) {
        this.y = canvas.height - 40 - this.height;
        endGame();
      }
      if (this.y <= 0) {
        this.y = 0;
        this.velocity = 0;
      }
    },
    draw() {
      ctx.save();
      ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
      let angle = Math.min(Math.max(this.velocity * 3, -25), 70);
      ctx.rotate((angle * Math.PI) / 180);

      // Cat Face/Head (Orange)
      ctx.fillStyle = "#FF8C00";
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.fillStyle = "#D2691E";
      // Left Ear
      ctx.beginPath();
      ctx.moveTo(-14, -10);
      ctx.lineTo(-6, -22);
      ctx.lineTo(-2, -12);
      ctx.fill();
      // Right Ear
      ctx.beginPath();
      ctx.moveTo(2, -12);
      ctx.lineTo(6, -22);
      ctx.lineTo(14, -10);
      ctx.fill();

      // Eyes
      ctx.fillStyle = "#FFF";
      ctx.beginPath();
      ctx.arc(-6, -3, 5, 0, Math.PI * 2);
      ctx.arc(6, -3, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(-5, -3, 2, 0, Math.PI * 2);
      ctx.arc(7, -3, 2, 0, Math.PI * 2);
      ctx.fill();

      // Nose
      ctx.fillStyle = "#FFB
